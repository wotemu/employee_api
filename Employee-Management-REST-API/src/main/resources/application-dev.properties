spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=ThisIsMyDevelopmentSecretKeyThatIsLongEnoughForHS256
jwt.expiration=86400000

logging.level.com.example.employee_api=DEBUG